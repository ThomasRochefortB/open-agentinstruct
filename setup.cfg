[metadata]
# description-file = README.md # Handled by pyproject.toml

[options]
package_dir =
    = .
packages = find:
python_requires = >=3.11,<3.15

# Keep runtime security minimums in wheel metadata, not only in uv.lock.
install_requires =
    python-dotenv>=1.0.0,<2
    nest_asyncio>=1.5.0,<2
    aiohttp>=3.14.4,<4
    backoff>=2.2.1,<3
    # Reviewed post-incident SDK release; do not install the compromised 1.107.0.
    litellm==1.103.8
    datasets>=5.0.1,<6
    pdfminer.six>=20260107
    certifi>=2026.10.19
    urllib3>=2.8.0,<3
    fsspec>=2026.6.0
    filelock>=4.2.1,<5

[options.packages.find]
where = .
# Exclude directories that are not part of the installable package
exclude =
    tests*
    data*
    .cache*
    finetuned_models*
    wandb*
    finetuning*
    notebooks*
    .github*
    .git*

# --- Include non-code files (agent configs) ---
[options.package_data]
open_agentinstruct = agents/split_agents/**/*.json

# --- Extras --- Define optional dependencies for different features/dev environments
[options.extras_require]
# Example: Add dependencies for specific LLM providers if you support multiple
# gemini =
#     google-generativeai>=0.3.0
# openai =
#     openai>=1.0.0

pdf =
    pdfminer.six>=20260107

hf_datasets =
    datasets>=5.0.1,<6

# Testing dependencies
test =
    pytest>=9.0.3,<10
    # Add other testing libs like pytest-cov, responses, etc.

# Development tools are locked alongside runtime requirements.
dev =
    %(test)s
    build>=1.6.1,<2
