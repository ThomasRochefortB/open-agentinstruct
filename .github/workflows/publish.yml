name: Publish tested package to PyPI

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'ThomasRochefortB/open-agentinstruct'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Verify version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py
      - name: Require completed trusted-publisher setup
        env:
          READY: ${{ vars.PYPI_TRUSTED_PUBLISHING_READY }}
        run: |
          if [ "$READY" != true ]; then
            echo '::error::Publishing is blocked. Complete docs/security.md and set PYPI_TRUSTED_PUBLISHING_READY=true only after verifying the PyPI binding and GitHub environment.'
            exit 1
          fi

  package-checks:
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    needs: package-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/open-agentinstruct
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
