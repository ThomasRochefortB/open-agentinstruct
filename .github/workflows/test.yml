name: Security and package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '29 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Audit and test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.0'
      - name: Export the locked dependency set without installing it
        run: uv export --locked --all-groups --all-extras --no-emit-project --no-hashes --output-file requirements-audit.txt
      - name: Audit before installing project dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --requirement requirements-audit.txt --no-deps --disable-pip --strict
      - name: Install the reviewed lockfile
        run: uv sync --locked --all-extras --group dev
      - name: Test without provider credentials or network calls
        run: uv run --locked pytest
      - name: Check CLI startup
        run: uv run --locked open-agentinstruct-generate --help

  build:
    name: Build and smoke-test distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.0'
      - run: uv build --no-sources
      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke-test the source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
